LAB_DESCRIPTION="SDN firewall"
LAB_VERSION=1.0

pc1[0]="LAN1"  # rete locale 1
pc2[0]="LAN1"

pc3[0]="LAN2"  # rete locale 2 (utile per fare test di routing e anche per implementare mac spoofing)
pc4[0]="LAN2"


srv[0]="LAN3" #server appartanente ad un'altra sottorete 
ext[0]="EXT"  # host esterno alla rete aziendale che fa da attacker

s1[0]="CTRL" # eth0 del firewall sarà collegata al controller 
s1[1]="LAN1"
s1[2]="LAN2"
s1[3]="LAN3"
s1[4]="EXT"


s1[image]="kathara/sdn"   #lo switch che farà da firewall userà l'immagine di kathara/sdn che contiene il software del firewall

ctrl[0]="CTRL"             
ctrl[image]="kathara/sdn" #il controller userà l'immagine di kathara/sdn 